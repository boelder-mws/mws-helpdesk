name: CodeQL

# Static analysis for security bugs in our own code. Free for public
# repositories; for a private repository it needs GitHub Code Security.
# It stays off until you create a repository variable ENABLE_CODEQL = true
# (Settings → Secrets and variables → Actions → Variables).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 11 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
