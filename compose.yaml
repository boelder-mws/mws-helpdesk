# IT Helpdesk: the app plus PostgreSQL, with optional automatic HTTPS (Caddy).
#
#   docker compose up -d --build                  app on http://127.0.0.1:3000
#   docker compose --profile tls up -d --build    also serve https://$HELPDESK_DOMAIN

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: mws-helpdesk:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://helpdesk:${POSTGRES_PASSWORD}@db:5432/helpdesk
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      # Local only. Put a reverse proxy in front (the tls profile, or your own).
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  caddy:
    profiles: ["tls"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      HELPDESK_DOMAIN: ${HELPDESK_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
